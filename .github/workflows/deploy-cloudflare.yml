name: CI & Deploy Cloudflare Python Worker

on:
  push:
    branches: [main, master]
    paths:
      - "chat/**"
      - "src/**"
      - "scripts/**"
      - "pyproject.toml"
      - "wrangler.jsonc"
      - ".github/workflows/deploy-cloudflare.yml"
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: cloudflare-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Backend & Worker Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync worker runtime modules
        run: python3 scripts/sync_worker_src.py

      - name: Run 302 unit & Worker router tests
        env:
          PENPAL_DEV: "1"
        run: uv run python manage.py test chat

  deploy:
    name: Deploy Python Worker to Cloudflare
    needs: test
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (for Wrangler)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync worker runtime modules
        run: python3 scripts/sync_worker_src.py

      - name: Deploy with pywrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          uv run pywrangler deploy
          if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
            printf "%s" "${{ secrets.GEMINI_API_KEY }}" | npx wrangler secret put GEMINI_API_KEY
          fi
          if [ -n "${{ secrets.PENPAL_TOKENS }}" ]; then
            printf "%s" "${{ secrets.PENPAL_TOKENS }}" | npx wrangler secret put PENPAL_TOKENS
          fi
